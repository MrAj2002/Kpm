name: Add website and publish Aniyomi repo
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Action
        required: true
        type: choice
        options: [add-or-update, rebuild, remove]
        default: add-or-update
      source_id:
        description: Stable ID, such as my-video-site. Reuse this ID for updates or removal.
        type: string
      source_name:
        description: Name displayed in Aniyomi
        type: string
      source_url:
        description: Public HTTPS website or video-page URL
        type: string
      language:
        description: Language code, e.g. en or all. Blank preserves the existing value.
        type: string
      adult:
        description: Adult content? preserve keeps the existing value; true marks adult.
        type: choice
        options: [preserve, 'false', 'true']
        default: preserve
      rules:
        description: Optional extraction rules JSON. Leave blank for defaults or existing rules.
        type: string
permissions:
  contents: write
concurrency:
  group: publish-aniyomi-repository
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
