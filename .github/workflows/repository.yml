          if hashlib.sha256(payload).hexdigest() != 'a6170cb821444e90f29bf8eed59c33d26ebf210276e8027ff03d693d4a8badf3':
              raise SystemExit('The workflow bundle is incomplete. Copy the entire workflow from the setup kit again.')
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              for member in archive.infolist():
                  path = pathlib.Path(member.filename)
                  if path.is_absolute() or '..' in path.parts or '.git' in path.parts:
                      raise SystemExit('Invalid bundled path.')
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(archive.read(member))
          print('Installed the complete source project.')
