      # END SELF-INSTALL
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check repository visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility=$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)
          if [ "$visibility" != public ]; then
            echo 'Aniyomi needs a publicly readable repository URL. Make this source repository public before publishing, or use a separate public publishing host.'
            exit 1
          fi
      - name: Add or update source definition
        env:
          SOURCE_OPERATION: ${{ inputs.operation }}
          SOURCE_ID: ${{ inputs.source_id }}
          SOURCE_NAME: ${{ inputs.source_name }}
          SOURCE_URL: ${{ inputs.source_url }}
          SOURCE_LANGUAGE: ${{ inputs.language }}
          SOURCE_ADULT: ${{ inputs.adult }}
          SOURCE_RULES: ${{ inputs.rules }}
        run: python scripts/source.py --apply
      - name: Restore verified tools
        uses: actions/cache@v4
        with:
          path: .cache
          key: aniyomi-builder-tools-${{ hashFiles('dependencies.lock.json') }}
      - name: Load private signing key
        env:
          REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
        run: |
          python - <<'PY'
          import base64,os,pathlib
          value=os.getenv('REPO_SIGNING_KEY','').strip()
          if not value: raise SystemExit('Add the REPO_SIGNING_KEY and REPO_SIGNING_PASSWORD repository secrets from your private signing kit.')
          path=pathlib.Path('signing/repo.p12');path.parent.mkdir(exist_ok=True)
          path.write_bytes(base64.b64decode(value,validate=True));path.chmod(0o600)
          PY
      - name: Validate and test configuration
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Build and verify signed extension APKs
        env:
          REPO_SIGNING_PASSWORD: ${{ secrets.REPO_SIGNING_PASSWORD }}
        run: python scripts/build.py
      - name: Run Kotlin extraction fixtures
        run: python scripts/test_parser.py
      - name: Publish sources and extension repository
        run: python scripts/publish.py
      - name: Downloadable repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: Aniyomi-Published-Repository
          path: repo-output/
          retention-days: 14
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        run: rm -f signing/repo.p12

